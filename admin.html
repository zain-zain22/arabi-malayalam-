<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>അറബി മലയാളം അഡ്മിൻ പാനൽ</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">
<div class="container">
  <h2>⚙️ അഡ്മിൻ പാനൽ</h2>
  <p class="subtitle">ഗിറ്റ്ഹബ് കോൺഫിഗറേഷനും വാക്ക് മാനേജുമെന്റും</p>

  <div class="config-box">
    <label for="ghToken" style="margin-top:0">GitHub Token (ഈ റിപ്പോയ്ക്ക് മാത്രമുള്ള fine-grained):</label>
    <input type="password" id="ghToken" placeholder="github_pat_xxxx" autocomplete="off">
    <label for="ghOwner">GitHub Username:</label>
    <input type="text" id="ghOwner" placeholder="ഉദാ: salmanulfaris">
    <label for="ghRepo">Repository:</label>
    <input type="text" id="ghRepo" placeholder="ഉദാ: arbi-malayalam">
    <div class="btn-group">
      <button class="btn btn-gray" id="saveCfg">💾 സേവ്</button>
      <button class="btn btn-gray" id="loadGh">⬇️ ഗിറ്റ്ഹബ്ബിൽ നിന്ന് ലോഡ്</button>
    </div>
    <p class="hint">ഈ പേജ് പബ്ലിക് സൈറ്റിൽ വയ്ക്കരുത്; ഫോണിൽ/കംപ്യൂട്ടറിൽ ലോക്കലായി തുറക്കുക.</p>
  </div>

  <div class="correction-box">
    <label for="pasteBox" style="margin-top:0">📥 വാട്സാപ്പ് തിരുത്തൽ പേസ്റ്റ് ചെയ്യുക:</label>
    <textarea id="pasteBox" style="height:90px" placeholder="തിരുത്തൽ&#10;വാക്ക്: ഭക്ഷണം&#10;രൂപം: ..."></textarea>
    <div class="btn-group"><button class="btn btn-main" id="pasteBtn">✔️ എടുക്കുക</button></div>
    <p class="hint">ഒന്നിലധികം സന്ദേശങ്ങൾ ഒന്നിച്ച് പേസ്റ്റ് ചെയ്യാം.</p>
  </div>

  <div style="display:flex;gap:18px;margin-top:15px;font-size:14px">
    <label style="margin:0;font-weight:normal"><input type="radio" name="kind" value="വാക്ക്" checked> വാക്ക്</label>
    <label style="margin:0;font-weight:normal"><input type="radio" name="kind" value="അക്ഷരം"> അക്ഷരം</label>
  </div>
  <label for="adminMal">മലയാളം വാക്ക് / അക്ഷരം:</label>
  <input type="text" id="adminMal" placeholder="ഉദാ: ഭക്ഷണം">
  <label for="adminArb">അറബി മലയാളം രൂപം:</label>
  <input type="text" id="adminArb" class="arabic-output" placeholder="بَهْكْشَڹَمْ">

  <div class="btn-group">
    <button class="btn btn-main" id="addBtn">➕ ലിസ്റ്റിലേക്ക് ചേർക്കുക</button>
    <button class="btn btn-github" id="syncBtn">☁️ ഗിറ്റ്ഹബ്ബിലേക്ക് പബ്ലിഷ്</button>
  </div>

  <label>നിലവിലുള്ള വാക്കുകൾ:</label>
  <div id="wordList" class="saved-list"></div>
  <label>നിലവിലുള്ള അക്ഷരങ്ങൾ:</label>
  <div id="letterList" class="saved-list"></div>

  <div class="creator-footer">Created by: <b>Salmanul Faris Zaini Mannarkkad</b><br>Phone/WhatsApp: <b>9895993822</b></div>
</div>
<div id="toast"></div>

<script>
"use strict";
const KEY = "my_arbi_dict", LKEY = "my_arbi_letters";
const $ = id => document.getElementById(id);
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function toast(m) {
  const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}
function getDict(k = KEY) {
  try {
    const p = JSON.parse(ls.get(k) || "{}");
    return p && typeof p === "object" && !Array.isArray(p) ? p : {};
  } catch (e) { return {}; }
}
function setDict(d, k = KEY) { ls.set(k, JSON.stringify(d)); }
const keyOf = isLetter => isLetter ? LKEY : KEY;
const isLetterSel = () => document.querySelector('input[name="kind"]:checked').value === "അക്ഷരം";

function loadConfig() {
  $("ghToken").value = ls.get("gh_token") || "";
  $("ghOwner").value = ls.get("gh_owner") || "";
  $("ghRepo").value = ls.get("gh_repo") || "";
}
function saveConfig() {
  ls.set("gh_token", $("ghToken").value.trim());
  ls.set("gh_owner", $("ghOwner").value.trim());
  ls.set("gh_repo", $("ghRepo").value.trim());
  toast("കോൺഫിഗറേഷൻ സേവ് ചെയ്തു");
}

function renderList() {
  renderInto($("wordList"), KEY, "വാക്കുകൾ ഒന്നുമില്ല");
  renderInto($("letterList"), LKEY, "അക്ഷരങ്ങൾ ഒന്നുമില്ല");
}
function renderInto(list, storeKey, emptyMsg) {
  const dict = getDict(storeKey), keys = Object.keys(dict);
  list.textContent = "";
  if (!keys.length) {
    const e = document.createElement("div");
    e.style.cssText = "text-align:center;color:#888";
    e.textContent = emptyMsg;
    list.appendChild(e); return;
  }
  keys.forEach(k => {
    const row = document.createElement("div"); row.className = "saved-item";
    const txt = document.createElement("span");
    const b = document.createElement("b"); b.textContent = k;
    const ar = document.createElement("span");
    ar.dir = "rtl"; ar.style.cssText = "font-family:Amiri,serif;color:#117864";
    ar.textContent = dict[k];
    txt.append(b, " : ", ar);
    const del = document.createElement("button");
    del.className = "small-btn"; del.textContent = "❌ നീക്കം";
    del.addEventListener("click", () => {
      const d = getDict(storeKey); delete d[k]; setDict(d, storeKey); renderList();
    });
    row.append(txt, del); list.appendChild(row);
  });
}

function addWord() {
  const mal = $("adminMal").value.normalize("NFC").trim();
  const arb = $("adminArb").value.trim();
  if (!mal || !arb) { toast("രണ്ടും പൂരിപ്പിക്കുക!"); return; }
  const sk = keyOf(isLetterSel()), d = getDict(sk); d[mal] = arb; setDict(d, sk);
  $("adminMal").value = ""; $("adminArb").value = "";
  renderList(); toast("ലിസ്റ്റിൽ ചേർത്തു (ഇനി പബ്ലിഷ് ചെയ്യുക)");
}

function parsePaste() {
  const text = $("pasteBox").value.normalize("NFC");
  const re = /(?:തരം:[ \t]*(.+?)[ \t]*\r?\n[ \t]*)?വാക്ക്:[ \t]*(.+?)[ \t]*\r?\n[ \t]*രൂപം:[ \t]*(.+)/g;
  const found = [];
  let m;
  while ((m = re.exec(text))) {
    const mal = m[2].trim(), arb = m[3].trim();
    if (mal && arb) found.push([mal, arb, (m[1] || "").trim() === "അക്ഷരം"]);
  }
  if (!found.length) { toast("തിരുത്തൽ കണ്ടെത്തിയില്ല"); return; }
  if (found.length === 1) {
    $("adminMal").value = found[0][0];
    $("adminArb").value = found[0][1];
    document.querySelector(`input[name="kind"][value="${found[0][2] ? "അക്ഷരം" : "വാക്ക്"}"]`).checked = true;
    toast("ഫീൽഡുകളിൽ നിറച്ചു; പരിശോധിച്ച് ചേർക്കുക");
  } else {
    if (!confirm(`${found.length} തിരുത്തലുകൾ ലിസ്റ്റിൽ ചേർക്കട്ടെ?`)) return;
    const w = getDict(KEY), l = getDict(LKEY);
    found.forEach(([k, v, isL]) => { (isL ? l : w)[k] = v; });
    setDict(w, KEY); setDict(l, LKEY); renderList();
    toast(`${found.length} തിരുത്തലുകൾ ചേർത്തു (ഇനി പബ്ലിഷ് ചെയ്യുക)`);
  }
  $("pasteBox").value = "";
}
$("pasteBtn").addEventListener("click", parsePaste);

/* ---- GitHub ---- */
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ""))));

function gh() {
  const token = ls.get("gh_token"), owner = ls.get("gh_owner"), repo = ls.get("gh_repo");
  if (!token || !owner || !repo) { toast("ആദ്യം ഗിറ്റ്ഹബ് വിവരങ്ങൾ സേവ് ചെയ്യുക"); return null; }
  return {
    url: `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/data.json`,
    headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
  };
}

async function fetchRemote(g) {
  const res = await fetch(g.url, { headers: g.headers, cache: "no-store" });
  if (res.status === 404) return { sha: undefined, words: {}, letters: {} };
  if (!res.ok) throw new Error((await res.json()).message || res.status);
  const f = await res.json();
  let d = {};
  try { d = JSON.parse(b64dec(f.content)); } catch (e) {}
  d = d && typeof d === "object" && !Array.isArray(d) ? d : {};
  const isNew = d.words || d.letters;
  return { sha: f.sha, words: isNew ? (d.words || {}) : d, letters: isNew ? (d.letters || {}) : {} };
}

async function loadFromGitHub() {
  const g = gh(); if (!g) return;
  try {
    const r = await fetchRemote(g);
    setDict(r.words, KEY); setDict(r.letters, LKEY); renderList();
    toast(`ലോഡ് ചെയ്തു: ${Object.keys(r.words).length} വാക്കുകൾ, ${Object.keys(r.letters).length} അക്ഷരങ്ങൾ`);
  } catch (e) { toast("ലോഡ് പരാജയപ്പെട്ടു: " + e.message); }
}

async function syncToGitHub() {
  const g = gh(); if (!g) return;
  const btn = $("syncBtn"); btn.disabled = true;
  try {
    const local = { words: getDict(KEY), letters: getDict(LKEY) };
    const r = await fetchRemote(g);
    const missing = Object.keys(r.words).filter(k => !(k in local.words))
      .concat(Object.keys(r.letters).filter(k => !(k in local.letters)));
    if (missing.length && !confirm(`ഗിറ്റ്ഹബ്ബിലെ ${missing.length} എണ്ണം ഇവിടെ ഇല്ല; പബ്ലിഷ് ചെയ്താൽ അവ മായും. തുടരട്ടെ?\n(ഒഴിവാക്കാൻ ആദ്യം "ഗിറ്റ്ഹബ്ബിൽ നിന്ന് ലോഡ്" അമർത്തുക)`)) return;
    const put = await fetch(g.url, {
      method: "PUT",
      headers: { ...g.headers, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "Update dictionary via Admin Panel",
        content: b64enc(JSON.stringify(local, null, 2)),
        sha: r.sha
      })
    });
    if (put.ok) toast("✅ ഗിറ്റ്ഹബ്ബിലേക്ക് പബ്ലിഷ് ചെയ്തു!");
    else toast("പരാജയപ്പെട്ടു: " + ((await put.json()).message || put.status));
  } catch (e) { toast("എറർ: " + e.message); }
  finally { btn.disabled = false; }
}

$("saveCfg").addEventListener("click", saveConfig);
$("loadGh").addEventListener("click", loadFromGitHub);
$("addBtn").addEventListener("click", addWord);
$("syncBtn").addEventListener("click", syncToGitHub);
loadConfig(); renderList();
</script>
</body>
</html>
